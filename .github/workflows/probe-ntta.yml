# One-off check: what the public NTTA / NCTCOG toll gantry and rate layers contain.
# Saves layer details and a few sample records to data/ntta-probe.json (public data).
# Run from Actions > Probe NTTA data > Run workflow.
name: Probe NTTA data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_ntta.py, .github/workflows/probe-ntta.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look at the layers
        run: python3 tools/probe_ntta.py
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ntta-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "NTTA data probe result"
          git pull --rebase -X theirs -q origin main
          git push
