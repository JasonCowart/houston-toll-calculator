# Publishes the site to GitHub Pages on every push to main.
# The ArcGIS API key comes from the repository secret ARCGIS_API_KEY
# (Settings > Secrets and variables > Actions) and is written into
# config.js only in the published copy, never in the code.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run toll tests
        run: node tools/test_tolls.js

      - name: Check verified rates are unchanged
        run: node tools/test_rates.js

      - name: Replay saved real trips
        run: node tools/test_trips.js

      # Lock switch: while a file named SITE_OFFLINE is in the repo, only a short
      # "not available" page is published. No app, no data, no API key.
      - name: Check lock switch
        id: lock
        run: |
          if [ -f SITE_OFFLINE ]; then
            echo "offline=true" >> "$GITHUB_OUTPUT"
            mkdir -p _offline
            cat > _offline/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex"><title>Not available</title>
          <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f6f8;color:#1c1b1d;font:16px/1.5 Montserrat,Arial,sans-serif}
          main{max-width:420px;padding:24px;text-align:center}h1{font-size:20px;color:#662d91;margin:0 0 8px}</style></head>
          <body><main><h1>This page isn't available</h1><p>It is not open to the public right now.</p></main></body></html>
          HTML
            cp _offline/index.html _offline/404.html
          else
            echo "offline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Insert API keys into config.js
        if: steps.lock.outputs.offline != 'true'
        env:
          ARCGIS_API_KEY: ${{ secrets.ARCGIS_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          # Where "Report a wrong toll" emails go (a repo variable, Settings > Secrets and variables > Actions > Variables).
          # It ends up visible in the site's config.js, as any mailto address would, so use a shared team inbox.
          REPORT_EMAIL: ${{ vars.REPORT_EMAIL }}
        run: |
          if [ -z "$ARCGIS_API_KEY" ]; then
            echo "::warning::ARCGIS_API_KEY secret is not set; the site will show the missing-key notice."
          fi
          # TomTom (debug view only for now); the key is limited to this site in TomTom's dashboard.
          KEY="$ARCGIS_API_KEY" TT="$TOMTOM_API_KEY" RE="$REPORT_EMAIL" node -e 'const c = { arcgisApiKey: process.env.KEY.trim() }; if (process.env.TT && process.env.TT.trim()) c.tomtomApiKey = process.env.TT.trim(); const re = (process.env.RE || "").trim(); if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(re)) c.reportEmail = re; require("fs").writeFileSync("config.js", "window.TOLL_CONFIG = " + JSON.stringify(c) + ";\n")'

      - name: Cache-bust scripts and styles
        if: steps.lock.outputs.offline != 'true'
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"(config\.js|js/[a-z]+\.js|css/[a-z]+\.css)\"#\1=\"\2?v=$V\"#g" index.html
          grep -E "v=$V" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.lock.outputs.offline == 'true' && '_offline' || '.' }}

      - id: deployment
        uses: actions/deploy-pages@v4
