# Downloads TxDOT's SH 288 toll schedule into data/sh288-rates.json and commits it.
# Runs when the fetch script changes, or by hand (Actions > Update SH 288 rates).
name: Update SH 288 rates

on:
  push:
    branches: [main]
    paths: [tools/fetch_sh288.py, .github/workflows/update-sh288.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch schedule
        run: python3 tools/fetch_sh288.py data/sh288-rates.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/sh288-rates.json && git ls-files --error-unmatch data/sh288-rates.json >/dev/null 2>&1; then
            echo "No change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sh288-rates.json
          git commit -m "Update SH 288 toll rates from TxDOT"
          git push
