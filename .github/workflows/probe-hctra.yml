name: Probe HCTRA rates page (temporary)
on:
  push:
    branches: [main]
    paths: [tools/probe_hctra.py, .github/workflows/probe-hctra.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet playwright==1.47.0
      - run: python3 tools/probe_hctra.py || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-hctra.json && git commit -m "HCTRA probe result" && git pull --rebase -q origin main && git push || true
